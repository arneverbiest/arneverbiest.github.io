<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Herstel App</title>
    <script type="text/javascript">
      // Single Page Apps voor GitHub Pages
      // Deze script zorgt ervoor dat paden zoals /five-g goed worden doorgegeven aan de hoofdpagina.
      var pathSegmentsToKeep = 1; // Zet dit op 1 omdat je repo-naam 'herstel-app' één segment is.

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
